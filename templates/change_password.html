<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Change Password | InterviewAI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
        }

        .card {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #0284c7;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .note {
            font-size: 13px;
            color: #475569;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🔐 Change Password</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="password" name="current_password" placeholder="Current Password" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <button type="submit">Update Password</button>
        </form>

        <p class="note">
            Password must include uppercase, lowercase, number & symbol
        </p>
    </div>

</body>

</html>
