<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP | InterviewAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-left">
            <h1>Interview<span>AI</span></h1>
            <p>Enter the Otp i ur email.</p>
        </div>

        <div class="auth-card">
            <h2>Verify OTP</h2>
            <p class="sub">OTP valid for 5 minutes ⏳</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <input type="text" name="otp" placeholder="Enter OTP" required>
                <button class="btn">✅ Verify OTP</button>
            </form>
        </div>
    </div>

</body>

</html>
